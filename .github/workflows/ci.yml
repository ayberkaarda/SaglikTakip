name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    env:
      # The SQL Server integration tests need a local instance; they run on developer machines.
      SAGLIKTAKIP_SKIP_SQL_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish src/SaglikTakip.UI -c Release -r win-x64 --self-contained false -o publish
      - name: Zip
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_NAME -notmatch '^v[A-Za-z0-9._-]+$') { throw "Unsafe tag name for a file name." }
          Copy-Item README.md, README.tr.md, CHANGELOG.md, CHANGELOG.tr.md publish/
          Compress-Archive -Path publish/* -DestinationPath "SaglikTakip-$($env:REF_NAME)-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SaglikTakip-${{ github.ref_name }}-win-x64
          path: SaglikTakip-${{ github.ref_name }}-win-x64.zip
          if-no-files-found: error
